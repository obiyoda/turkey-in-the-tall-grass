<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turkey in the Tall Grass</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <main>
        <header>
            <h1>Turkey in the Tall Grass</h1>
            <p id="goal">Find the green apple before the hunters find you.</p>
        </header>
        <section aria-label="Game">
            <div class="toolbar">
                <div class="buttons">
                    <button id="start" type="button">Start</button>
                    <button id="restart" type="button">Restart</button>
                </div>
                <span id="gear" aria-label="Equipped gear"></span>
            </div>
            <p id="game-status" role="status">Loading game…</p>
            <div id="game-container" tabindex="0" aria-label="Game field. Use the arrow keys or WASD to move."></div>
            <p class="controls">WASD or arrow keys to move · Space to hide or emerge in tall grass · E to interact · F for sword · G for bow · R to restart</p>
        </section>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
